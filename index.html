<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RRS Printer Entry & Invoice</title>
  <!-- Direct PDF Generation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: #f0f4fa;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(3, 64, 171, 0.12);
      overflow: hidden;
    }
    .banner-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
    .card-body {
      padding: 20px 24px 24px;
    }
    h2 {
      margin: 0 0 16px;
      color: rgb(3, 64, 171);
      font-size: 20px;
      text-align: center;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
      margin-top: 13px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: rgb(3, 64, 171); }
    .toggle-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .toggle-btn {
      padding: 10px;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      color: #334155;
      text-align: center;
    }
    .toggle-btn.active {
      background: rgb(3, 64, 171);
      color: #fff;
      border-color: rgb(3, 64, 171);
    }
    .summary-box {
      background: #eef4ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #1e3a8a;
    }
    .summary-box div { text-align: center; }
    .summary-box strong { display: block; font-size: 17px; margin-top: 2px; }
    .save-btn {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      background: rgb(3, 64, 171);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .save-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    #status {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }

    /* Invoice Styles */
    #invoiceSection { display: none; }
    .inv-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed #cbd5e1;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .inv-title {
      font-size: 18px;
      font-weight: 800;
      color: rgb(3, 64, 171);
      letter-spacing: 0.5px;
    }
    .inv-meta {
      font-size: 12px;
      color: #64748b;
      text-align: right;
    }
    .inv-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
    }
    .inv-table td {
      padding: 11px 6px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
    }
    .inv-table td:first-child {
      color: #475569;
      font-weight: 600;
    }
    .inv-table td:last-child {
      text-align: right;
      color: #0f172a;
      font-weight: 700;
    }
    .inv-total-row {
      background: #eef4ff;
      border-radius: 10px;
      padding: 14px 16px;
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1.5px solid #bfdbfe;
    }
    .inv-total-row span {
      font-size: 15px;
      font-weight: 700;
      color: #1e3a8a;
    }
    .inv-total-row strong {
      font-size: 22px;
      color: rgb(3, 64, 171);
    }
    .inv-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 24px 24px;
    }
    .btn-print {
      padding: 12px;
      background: rgb(3, 64, 171);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-new {
      padding: 12px;
      background: #e2e8f0;
      color: #1e293b;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .inv-footer {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- PDF-la capture aagura area (Banner + Invoice Body) -->
  <div id="pdfContent" style="background: #ffffff;">
    <img src="Flexora%20HUB%20Banner.png" alt="Flexora HUB Banner" class="banner-img" />

    <!-- FORM SECTION -->
    <div class="card-body" id="formSection">
      <h2>Printer Job Entry</h2>

      <label>Name of the Customer</label>
      <input type="text" id="customerName" placeholder="Enter Customer Name" />

      <label>Name of the Job</label>
      <input type="text" id="jobPurpose" placeholder="Enter Job Name" />

      <label>Number of Pages</label>
      <input type="number" id="numPages" min="1" placeholder="e.g. 10" oninput="calculate()" />

      <label>Print Color</label>
      <div class="toggle-group">
        <button type="button" class="toggle-btn active" id="btnBW" onclick="setColor('bw')">Black & White</button>
        <button type="button" class="toggle-btn" id="btnColor" onclick="setColor('color')">Color</button>
      </div>

      <label>Print Side</label>
      <div class="toggle-group">
        <button type="button" class="toggle-btn active" id="btnSingle" onclick="setSide('single')">Single Side</button>
        <button type="button" class="toggle-btn" id="btnFrontBack" onclick="setSide('frontback')">Front & Back</button>
      </div>

      <label>Amount Mode</label>
      <div class="toggle-group">
        <button type="button" class="toggle-btn active" id="btnAuto" onclick="setMode('auto')">Set Automatic Amount</button>
        <button type="button" class="toggle-btn" id="btnManual" onclick="setMode('manual')">Set Manual Amount</button>
      </div>

      <div id="autoBox">
        <label id="rateLabel">Rate Per Sheet (₹)</label>
        <input type="number" id="autoRate" step="0.01" min="0" value="2" oninput="saveDefaultRate(); calculate();" />
      </div>

      <div id="manualBox" style="display:none;">
        <label>Total Amount Collected (₹)</label>
        <input type="number" id="manualTotal" step="0.01" min="0" placeholder="e.g. 40" oninput="calculate()" />
      </div>

      <div class="summary-box">
        <div>Paper QTY<strong id="dispQty">0</strong></div>
        <div>Amt / Page<strong id="dispRate">₹0</strong></div>
        <div>Total Amount<strong id="dispTotal">₹0</strong></div>
      </div>

      <button type="button" class="save-btn" id="saveBtn" onclick="saveJob()">Save & Download Invoice</button>
      <div id="status"></div>
    </div>

    <!-- INVOICE SECTION -->
    <div class="card-body" id="invoiceSection">
      <div class="inv-header">
        <div class="inv-title">INVOICE</div>
        <div class="inv-meta">
          <div id="invNo" style="font-weight: 700; color: #0f172a;">[RRS-154]</div>
          <div id="invDate"></div>
        </div>
      </div>

      <table class="inv-table">
        <tr>
          <td>Name of the Customer</td>
          <td id="invCustomer">-</td>
        </tr>
        <tr>
          <td>Name of the Job</td>
          <td id="invJob">-</td>
        </tr>
        <tr>
          <td>Number of Pages</td>
          <td id="invPages">-</td>
        </tr>
        <tr>
          <td>Print Color</td>
          <td id="invColor">-</td>
        </tr>
        <tr>
          <td>Print Side</td>
          <td id="invSide">-</td>
        </tr>
      </table>

      <div class="inv-total-row">
        <span>Total Amount</span>
        <strong id="invTotal">₹0</strong>
      </div>

      <div class="inv-footer">Thank you for choosing RRS FlexoraHub!</div>
    </div>
  </div>

  <!-- Action Buttons (PDF-la varaadhu) -->
  <div class="inv-actions" id="invActions" style="display: none;">
    <button type="button" class="btn-print" onclick="downloadPDF()">Download PDF Again</button>
    <button type="button" class="btn-new" onclick="newEntry()">+ New Entry</button>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_Rqv5J_psAZw45CKIWQXBDWa-uancPp8gaoIVKTZbc9viMDcx90wB3HJYHeT4tvLsLQ/exec";

  let printColor = "bw";
  let printSide = "single";
  let amountMode = "auto";
  let currentPdfFilename = "Invoice.pdf";

  // Series Invoice Number Generator starting from [RRS-154]
  function getNextInvoiceNumber() {
    let lastNum = parseInt(localStorage.getItem("rrs_custom_series") || "153", 10);
    let nextNum = lastNum + 1;
    localStorage.setItem("rrs_custom_series", nextNum);
    return "RRS-" + String(nextNum).padStart(3, "0");
  }

  function getSavedRate(color, side) {
    const key = "rrs_rate_" + color + "_" + side;
    const defaults = {
      "bw_single": 2,
      "bw_frontback": 3,
      "color_single": 10,
      "color_frontback": 15
    };
    return localStorage.getItem(key) || defaults[color + "_" + side];
  }

  function saveDefaultRate() {
    const key = "rrs_rate_" + printColor + "_" + printSide;
    localStorage.setItem(key, document.getElementById("autoRate").value);
  }

  function setColor(color) {
    printColor = color;
    document.getElementById("btnBW").classList.toggle("active", color === "bw");
    document.getElementById("btnColor").classList.toggle("active", color === "color");
    document.getElementById("autoRate").value = getSavedRate(printColor, printSide);
    calculate();
  }

  function setSide(side) {
    printSide = side;
    document.getElementById("btnSingle").classList.toggle("active", side === "single");
    document.getElementById("btnFrontBack").classList.toggle("active", side === "frontback");
    document.getElementById("autoRate").value = getSavedRate(printColor, printSide);
    calculate();
  }

  function setMode(mode) {
    amountMode = mode;
    document.getElementById("btnAuto").classList.toggle("active", mode === "auto");
    document.getElementById("btnManual").classList.toggle("active", mode === "manual");
    document.getElementById("autoBox").style.display = mode === "auto" ? "block" : "none";
    document.getElementById("manualBox").style.display = mode === "manual" ? "block" : "none";
    calculate();
  }

  function calculate() {
    const pages = parseInt(document.getElementById("numPages").value) || 0;
    const paperQty = printSide === "single" ? pages : Math.ceil(pages / 2);

    let amtPerPage = 0;
    let totalAmount = 0;

    if (paperQty > 0) {
      if (amountMode === "auto") {
        amtPerPage = parseFloat(document.getElementById("autoRate").value) || 0;
        totalAmount = +(paperQty * amtPerPage).toFixed(2);
      } else {
        totalAmount = parseFloat(document.getElementById("manualTotal").value) || 0;
        amtPerPage = +(totalAmount / paperQty).toFixed(2);
      }
    }

    document.getElementById("dispQty").innerText = paperQty;
    document.getElementById("dispRate").innerText = "₹" + amtPerPage;
    document.getElementById("dispTotal").innerText = "₹" + totalAmount;

    return { pages, paperQty, amtPerPage, totalAmount };
  }

  function downloadPDF() {
    const element = document.getElementById("pdfContent");
    const opt = {
      margin:       10,
      filename:     currentPdfFilename,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true },
      jsPDF:        { unit: 'mm', format: 'a5', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save();
  }

  async function saveJob() {
    const customerName = document.getElementById("customerName").value.trim();
    const rawJobName = document.getElementById("jobPurpose").value.trim();
    const { pages, paperQty, amtPerPage, totalAmount } = calculate();
    const statusEl = document.getElementById("status");
    const btn = document.getElementById("saveBtn");

    if (!customerName) {
      statusEl.style.color = "red";
      statusEl.innerText = "Customer Name enter pannunga!";
      return;
    }
    if (!rawJobName) {
      statusEl.style.color = "red";
      statusEl.innerText = "Job Name enter pannunga!";
      return;
    }
    if (paperQty <= 0 || totalAmount <= 0) {
      statusEl.style.color = "red";
      statusEl.innerText = "Pages matrum Amount sariya kudunga!";
      return;
    }

    const colorText = printColor === "bw" ? "Black & White" : "Color";
    const sideText = printSide === "single" ? "Single Side" : "Front & Back";
    const finalJobPurpose = rawJobName + " - " + customerName + " (" + colorText + ")";

    btn.disabled = true;
    btn.innerText = "Saving & Downloading PDF...";
    statusEl.innerText = "";

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          jobPurpose: finalJobPurpose,
          paperQty: paperQty,
          amtPerPage: amtPerPage,
          amount: totalAmount
        })
      });

      // Series Invoice Number & Date
      const now = new Date();
      const dateStr = now.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
      const invCode = getNextInvoiceNumber();
      const safeCustomer = customerName.replace(/[^a-zA-Z0-9]/g, "_");
      currentPdfFilename = invCode + "_" + safeCustomer + ".pdf";

      document.getElementById("invNo").innerText = "[" + invCode + "]";
      document.getElementById("invDate").innerText = dateStr;
      document.getElementById("invCustomer").innerText = customerName;
      document.getElementById("invJob").innerText = rawJobName;
      document.getElementById("invPages").innerText = pages + " Pages";
      document.getElementById("invColor").innerText = colorText;
      document.getElementById("invSide").innerText = sideText;
      document.getElementById("invTotal").innerText = "₹" + totalAmount;

      // Switch to Invoice view & auto-download PDF
      document.getElementById("formSection").style.display = "none";
      document.getElementById("invoiceSection").style.display = "block";
      document.getElementById("invActions").style.display = "grid";

      setTimeout(() => {
        downloadPDF();
      }, 300);

    } catch (err) {
      statusEl.style.color = "red";
      statusEl.innerText = "Error: " + err.message;
    } finally {
      btn.disabled = false;
      btn.innerText = "Save & Download Invoice";
    }
  }

  function newEntry() {
    document.getElementById("customerName").value = "";
    document.getElementById("jobPurpose").value = "";
    document.getElementById("numPages").value = "";
    document.getElementById("manualTotal").value = "";
    calculate();
    document.getElementById("invoiceSection").style.display = "none";
    document.getElementById("invActions").style.display = "none";
    document.getElementById("formSection").style.display = "block";
  }

  // Initial load
  document.getElementById("autoRate").value = getSavedRate("bw", "single");
</script>

</body>
</html>
