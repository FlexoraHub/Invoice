<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RRS FlexoraHub - Printer Billing & Invoice</title>
  <!-- Direct PDF Generation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body {
      margin: 0;
      padding: 14px;
      width: 100%;
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      justify-content: center;
    }

    /* Second Image-la irukkura maari clean scaling + normal subtle outline */
    .website-container {
      background: #ffffff;
      width: 100%;
      max-width: 1120px;
      min-height: calc(100vh - 28px);
      display: flex;
      flex-direction: column;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      overflow: hidden;
    }

    .banner-wrapper {
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 6px 12px;
    }
    .banner-img {
      width: 100%;
      max-height: 145px;
      object-fit: contain;
      display: block;
    }
    .content-area {
      width: 100%;
      padding: 18px 28px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    h2 {
      margin: 0 0 18px;
      color: rgb(3, 64, 171);
      font-size: 22px;
      text-align: center;
      letter-spacing: 0.3px;
      border-bottom: 1.5px solid #eef4ff;
      padding-bottom: 10px;
    }

    /* 3 Columns per Row - Second Image exact proportion */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px 24px;
    }
    label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: rgb(3, 64, 171);
    }
    .toggle-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .toggle-btn {
      padding: 11px 10px;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      color: #334155;
      text-align: center;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: rgb(3, 64, 171);
      color: #fff;
      border-color: rgb(3, 64, 171);
    }

    .spiral-inline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Bottom Bar: Amount Bottom-Left & Save Button Bottom-Right */
    .bottom-bar {
      margin-top: auto;
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 20px;
    }
    .summary-box {
      background: #eef4ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 13.5px;
      color: #1e3a8a;
    }
    .summary-box div { text-align: center; }
    .summary-box strong {
      display: block;
      font-size: 20px;
      margin-top: 2px;
      color: rgb(3, 64, 171);
    }
    .action-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      min-width: 260px;
    }
    .save-btn {
      width: 100%;
      height: 100%;
      min-height: 60px;
      padding: 14px 28px;
      background: rgb(3, 64, 171);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .save-btn:hover { background: #022d7a; }
    .save-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    #status {
      margin-top: 6px;
      text-align: right;
      font-size: 13px;
      font-weight: 600;
    }

    /* Invoice Styles */
    #invoiceSection { display: none; max-width: 760px; margin: 0 auto; width: 100%; }
    .inv-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed #cbd5e1;
      padding-bottom: 14px;
      margin-bottom: 18px;
    }
    .inv-title {
      font-size: 22px;
      font-weight: 800;
      color: rgb(3, 64, 171);
      letter-spacing: 0.5px;
    }
    .inv-meta {
      font-size: 14px;
      color: #64748b;
      text-align: right;
    }
    .inv-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    .inv-table td {
      padding: 13px 10px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 15.5px;
    }
    .inv-table td:first-child {
      color: #475569;
      font-weight: 600;
    }
    .inv-table td:last-child {
      text-align: right;
      color: #0f172a;
      font-weight: 700;
    }
    .inv-total-row {
      background: #eef4ff;
      border-radius: 10px;
      padding: 15px 20px;
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #bfdbfe;
    }
    .inv-total-row span {
      font-size: 17px;
      font-weight: 700;
      color: #1e3a8a;
    }
    .inv-total-row strong {
      font-size: 24px;
      color: rgb(3, 64, 171);
    }
    .inv-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 0 28px 28px;
    }
    .btn-print {
      padding: 13px;
      background: rgb(3, 64, 171);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-new {
      padding: 13px;
      background: #e2e8f0;
      color: #1e293b;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .inv-footer {
      text-align: center;
      font-size: 13.5px;
      color: #64748b;
      margin-top: 18px;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .form-grid { grid-template-columns: 1fr 1fr; }
      .bottom-bar { flex-direction: column; }
      .summary-box { justify-content: space-around; gap: 12px; }
      .action-right { width: 100%; }
    }
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .content-area { padding: 16px; }
      .inv-actions { padding: 0 16px 20px; }
    }
  </style>
</head>
<body>

<div class="website-container">
  <!-- PDF-la capture aagura area (Banner + Invoice Body) -->
  <div id="pdfContent" style="background: #ffffff; width: 100%; flex: 1; display: flex; flex-direction: column;">
    <div class="banner-wrapper">
      <img src="Flexora%20HUB%20Banner.png" alt="Flexora HUB Banner" class="banner-img" />
    </div>

    <!-- FORM SECTION -->
    <div class="content-area" id="formSection">
      <h2>Printer Job Entry</h2>

      <div class="form-grid">
        <!-- Row 1: 3 Entries -->
        <div>
          <label>Name of the Customer</label>
          <input type="text" id="customerName" placeholder="Enter Customer Name" />
        </div>

        <div>
          <label>Name of the Job</label>
          <input type="text" id="jobPurpose" placeholder="Enter Job Name" />
        </div>

        <div>
          <label>Number of Pages</label>
          <input type="number" id="numPages" min="1" placeholder="e.g. 10" oninput="calculate()" />
        </div>

        <!-- Row 2: 3 Entries -->
        <div>
          <label>Print Color</label>
          <div class="toggle-group">
            <button type="button" class="toggle-btn active" id="btnBW" onclick="setColor('bw')">Black & White</button>
            <button type="button" class="toggle-btn" id="btnColor" onclick="setColor('color')">Color</button>
          </div>
        </div>

        <div>
          <label>Print Side</label>
          <div class="toggle-group">
            <button type="button" class="toggle-btn active" id="btnSingle" onclick="setSide('single')">Single Side</button>
            <button type="button" class="toggle-btn" id="btnFrontBack" onclick="setSide('frontback')">Front & Back</button>
          </div>
        </div>

        <div>
          <label>Binding / Spiral</label>
          <div class="toggle-group">
            <button type="button" class="toggle-btn active" id="btnWithoutSpiral" onclick="setSpiral('without')">Without Spiral</button>
            <button type="button" class="toggle-btn" id="btnWithSpiral" onclick="setSpiral('with')">With Spiral</button>
          </div>
        </div>

        <!-- Row 3: 3 Entries -->
        <div>
          <label>Amount Mode</label>
          <div class="toggle-group">
            <button type="button" class="toggle-btn active" id="btnAuto" onclick="setMode('auto')">Automatic Amount</button>
            <button type="button" class="toggle-btn" id="btnManual" onclick="setMode('manual')">Manual Amount</button>
          </div>
        </div>

        <div id="autoBox">
          <label id="rateLabel">Rate Per Sheet (₹)</label>
          <input type="number" id="autoRate" step="0.01" min="0" value="2" oninput="saveDefaultRate(); calculate();" />
        </div>

        <div id="manualBox" style="display:none;">
          <label>Total Print Amount Collected (₹)</label>
          <input type="number" id="manualTotal" step="0.01" min="0" placeholder="e.g. 40" oninput="calculate()" />
        </div>

        <div id="spiralBox" style="display:none;">
          <div class="spiral-inline">
            <div>
              <label>No. of Spirals</label>
              <select id="spiralQty" onchange="calculate()"></select>
            </div>
            <div>
              <label>Spiral Rate (₹)</label>
              <input type="number" id="spiralRate" min="0" step="1" value="30" oninput="calculate()" />
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom-Left Amount & Bottom-Right Save Button -->
      <div class="bottom-bar">
        <div class="summary-box">
          <div>Paper QTY<strong id="dispQty">0</strong></div>
          <div>Amt / Page<strong id="dispRate">₹0</strong></div>
          <div>Print Amount<strong id="dispPrintAmt">₹0</strong></div>
          <div>Grand Total<strong id="dispTotal">₹0</strong></div>
        </div>

        <div class="action-right">
          <button type="button" class="save-btn" id="saveBtn" onclick="saveJob()">Save & Download Invoice</button>
          <div id="status"></div>
        </div>
      </div>
    </div>

    <!-- INVOICE SECTION -->
    <div class="content-area" id="invoiceSection">
      <div class="inv-header">
        <div class="inv-title">INVOICE</div>
        <div class="inv-meta">
          <div id="invNo" style="font-weight: 700; color: #0f172a; font-size: 16px;">[RRS-154]</div>
          <div id="invDate"></div>
        </div>
      </div>

      <table class="inv-table">
        <tr>
          <td>Name of the Customer</td>
          <td id="invCustomer">-</td>
        </tr>
        <tr>
          <td>Name of the Job</td>
          <td id="invJob">-</td>
        </tr>
        <tr>
          <td>Number of Pages</td>
          <td id="invPages">-</td>
        </tr>
        <tr>
          <td>Print Color</td>
          <td id="invColor">-</td>
        </tr>
        <tr>
          <td>Print Side</td>
          <td id="invSide">-</td>
        </tr>
        <tr id="invSpiralRow" style="display:none;">
          <td>Spiral Amount</td>
          <td id="invSpiralAmt">-</td>
        </tr>
      </table>

      <div class="inv-total-row">
        <span>Total Amount</span>
        <strong id="invTotal">₹0</strong>
      </div>

      <div class="inv-footer">Thank you for choosing RRS FlexoraHub!</div>
    </div>
  </div>

  <!-- Action Buttons (PDF-la varaadhu) -->
  <div class="inv-actions" id="invActions" style="display: none;">
    <button type="button" class="btn-print" onclick="downloadPDF()">Download PDF Again</button>
    <button type="button" class="btn-new" onclick="newEntry()">+ New Entry</button>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_Rqv5J_psAZw45CKIWQXBDWa-uancPp8gaoIVKTZbc9viMDcx90wB3HJYHeT4tvLsLQ/exec";

  let printColor = "bw";
  let printSide = "single";
  let spiralOption = "without";
  let amountMode = "auto";
  let currentPdfFilename = "Invoice.pdf";

  // Populate Spiral Dropdown (1 to 50)
  const spiralSelect = document.getElementById("spiralQty");
  for (let i = 1; i <= 50; i++) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.text = i + (i === 1 ? " Spiral" : " Spirals");
    spiralSelect.appendChild(opt);
  }

  // Series Invoice Number Generator starting from [RRS-154]
  function getNextInvoiceNumber() {
    let lastNum = parseInt(localStorage.getItem("rrs_custom_series") || "153", 10);
    let nextNum = lastNum + 1;
    localStorage.setItem("rrs_custom_series", nextNum);
    return "RRS-" + String(nextNum).padStart(3, "0");
  }

  function getSavedRate(color, side) {
    const key = "rrs_rate_" + color + "_" + side;
    const defaults = {
      "bw_single": 2,
      "bw_frontback": 3,
      "color_single": 10,
      "color_frontback": 15
    };
    return localStorage.getItem(key) || defaults[color + "_" + side];
  }

  function saveDefaultRate() {
    const key = "rrs_rate_" + printColor + "_" + printSide;
    localStorage.setItem(key, document.getElementById("autoRate").value);
  }

  function setColor(color) {
    printColor = color;
    document.getElementById("btnBW").classList.toggle("active", color === "bw");
    document.getElementById("btnColor").classList.toggle("active", color === "color");
    document.getElementById("autoRate").value = getSavedRate(printColor, printSide);
    calculate();
  }

  function setSide(side) {
    printSide = side;
    document.getElementById("btnSingle").classList.toggle("active", side === "single");
    document.getElementById("btnFrontBack").classList.toggle("active", side === "frontback");
    document.getElementById("autoRate").value = getSavedRate(printColor, printSide);
    calculate();
  }

  function setSpiral(option) {
    spiralOption = option;
    document.getElementById("btnWithoutSpiral").classList.toggle("active", option === "without");
    document.getElementById("btnWithSpiral").classList.toggle("active", option === "with");
    document.getElementById("spiralBox").style.display = option === "with" ? "block" : "none";
    calculate();
  }

  function setMode(mode) {
    amountMode = mode;
    document.getElementById("btnAuto").classList.toggle("active", mode === "auto");
    document.getElementById("btnManual").classList.toggle("active", mode === "manual");
    document.getElementById("autoBox").style.display = mode === "auto" ? "block" : "none";
    document.getElementById("manualBox").style.display = mode === "manual" ? "block" : "none";
    calculate();
  }

  function calculate() {
    const pages = parseInt(document.getElementById("numPages").value) || 0;
    const paperQty = printSide === "single" ? pages : Math.ceil(pages / 2);

    let amtPerPage = 0;
    let printAmount = 0;

    if (paperQty > 0) {
      if (amountMode === "auto") {
        amtPerPage = parseFloat(document.getElementById("autoRate").value) || 0;
        printAmount = +(paperQty * amtPerPage).toFixed(2);
      } else {
        printAmount = parseFloat(document.getElementById("manualTotal").value) || 0;
        amtPerPage = +(printAmount / paperQty).toFixed(2);
      }
    }

    let spiralQty = 0;
    let spiralRate = 0;
    let spiralAmount = 0;

    if (spiralOption === "with") {
      spiralQty = parseInt(document.getElementById("spiralQty").value) || 1;
      spiralRate = parseFloat(document.getElementById("spiralRate").value) || 0;
      spiralAmount = +(spiralQty * spiralRate).toFixed(2);
    }

    const totalAmount = +(printAmount + spiralAmount).toFixed(2);

    document.getElementById("dispQty").innerText = paperQty;
    document.getElementById("dispRate").innerText = "₹" + amtPerPage;
    document.getElementById("dispPrintAmt").innerText = "₹" + printAmount;
    document.getElementById("dispTotal").innerText = "₹" + totalAmount;

    return { pages, paperQty, amtPerPage, printAmount, spiralQty, spiralRate, spiralAmount, totalAmount };
  }

  function downloadPDF() {
    const element = document.getElementById("pdfContent");
    const opt = {
      margin:       10,
      filename:     currentPdfFilename,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save();
  }

  async function saveJob() {
    const customerName = document.getElementById("customerName").value.trim();
    const rawJobName = document.getElementById("jobPurpose").value.trim();
    const { pages, paperQty, amtPerPage, printAmount, spiralQty, spiralRate, spiralAmount, totalAmount } = calculate();
    const statusEl = document.getElementById("status");
    const btn = document.getElementById("saveBtn");

    if (!customerName) {
      statusEl.style.color = "red";
      statusEl.innerText = "Customer Name enter pannunga!";
      return;
    }
    if (!rawJobName) {
      statusEl.style.color = "red";
      statusEl.innerText = "Job Name enter pannunga!";
      return;
    }
    if (paperQty <= 0 || printAmount <= 0) {
      statusEl.style.color = "red";
      statusEl.innerText = "Pages matrum Print Amount sariya kudunga!";
      return;
    }

    const colorText = printColor === "bw" ? "Black & White" : "Color";
    const sideText = printSide === "single" ? "Single Side" : "Front & Back";

    btn.disabled = true;
    btn.innerText = "Saving & Downloading PDF...";
    statusEl.innerText = "";

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          jobPurpose: rawJobName,
          paperQty: paperQty,
          amtPerPage: amtPerPage,
          amount: printAmount
        })
      });

      const now = new Date();
      const dateStr = now.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
      const invCode = getNextInvoiceNumber();
      const safeCustomer = customerName.replace(/[^a-zA-Z0-9 ]/g, "").trim();
      currentPdfFilename = safeCustomer + "_" + invCode + ".pdf";

      document.getElementById("invNo").innerText = "[" + invCode + "]";
      document.getElementById("invDate").innerText = dateStr;
      document.getElementById("invCustomer").innerText = customerName;
      document.getElementById("invJob").innerText = rawJobName;
      document.getElementById("invPages").innerText = pages + " Pages";
      document.getElementById("invColor").innerText = colorText;
      document.getElementById("invSide").innerText = sideText;

      if (spiralOption === "with") {
        document.getElementById("invSpiralRow").style.display = "table-row";
        document.getElementById("invSpiralAmt").innerText = spiralQty + " × ₹" + spiralRate + " = ₹" + spiralAmount;
      } else {
        document.getElementById("invSpiralRow").style.display = "none";
      }

      document.getElementById("invTotal").innerText = "₹" + totalAmount;

      document.getElementById("formSection").style.display = "none";
      document.getElementById("invoiceSection").style.display = "block";
      document.getElementById("invActions").style.display = "grid";

      setTimeout(() => {
        downloadPDF();
      }, 300);

    } catch (err) {
      statusEl.style.color = "red";
      statusEl.innerText = "Error: " + err.message;
    } finally {
      btn.disabled = false;
      btn.innerText = "Save & Download Invoice";
    }
  }

  function newEntry() {
    document.getElementById("customerName").value = "";
    document.getElementById("jobPurpose").value = "";
    document.getElementById("numPages").value = "";
    document.getElementById("manualTotal").value = "";
    setSpiral("without");
    document.getElementById("spiralQty").value = "1";
    document.getElementById("spiralRate").value = "30";
    calculate();
    document.getElementById("invoiceSection").style.display = "none";
    document.getElementById("invActions").style.display = "none";
    document.getElementById("formSection").style.display = "block";
  }

  // Initial load
  document.getElementById("autoRate").value = getSavedRate("bw", "single");
</script>

</body>
</html>
