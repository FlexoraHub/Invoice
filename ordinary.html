<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RRS FlexoraHub - Ordinary Billing</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body {
      margin: 0;
      padding: 14px;
      width: 100%;
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      justify-content: center;
    }

    .website-container {
      background: #ffffff;
      width: 100%;
      max-width: 1120px;
      min-height: calc(100vh - 28px);
      display: flex;
      flex-direction: column;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      overflow: hidden;
    }

    .banner-wrapper {
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 6px 12px;
    }
    .banner-img {
      width: 100%;
      max-height: 140px;
      object-fit: contain;
      display: block;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      border-bottom: 1.5px solid #e2e8f0;
      padding: 10px 28px;
    }
    .home-btn {
      text-decoration: none;
      padding: 7px 14px;
      background: #eef4ff;
      color: rgb(3, 64, 171);
      border: 1px solid #bfdbfe;
      border-radius: 7px;
      font-size: 13.5px;
      font-weight: 700;
    }
    .home-btn:hover {
      background: rgb(3, 64, 171);
      color: #ffffff;
    }
    .page-tag {
      font-size: 13.5px;
      font-weight: 700;
      color: #475569;
    }

    .content-area {
      width: 100%;
      padding: 18px 28px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    h2 {
      margin: 0 0 18px;
      color: rgb(3, 64, 171);
      font-size: 22px;
      text-align: center;
      letter-spacing: 0.3px;
      border-bottom: 1.5px solid #eef4ff;
      padding-bottom: 10px;
    }

    .customer-row {
      max-width: 520px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: rgb(3, 64, 171);
    }

    .products-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .products-header h3 {
      margin: 0;
      font-size: 16px;
      color: rgb(3, 64, 171);
    }
    .btn-add-product {
      padding: 9px 18px;
      background: #eef4ff;
      color: rgb(3, 64, 171);
      border: 1.5px solid #bfdbfe;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-add-product:hover {
      background: rgb(3, 64, 171);
      color: #ffffff;
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .product-row {
      display: grid;
      grid-template-columns: 2.2fr 1fr 1fr 1.1fr 42px;
      gap: 14px;
      align-items: end;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .row-total-box {
      background: #ffffff;
      border: 1.5px solid #bfdbfe;
      border-radius: 8px;
      padding: 10px 12px;
      text-align: right;
      font-size: 16px;
      font-weight: 800;
      color: rgb(3, 64, 171);
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .btn-remove-row {
      height: 44px;
      width: 42px;
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fecaca;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-remove-row:hover {
      background: #dc2626;
      color: #ffffff;
    }

    /* Bottom Bar */
    .bottom-bar {
      margin-top: auto;
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 20px;
    }
    .summary-box {
      background: #eef4ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      gap: 32px;
      font-size: 13.5px;
      color: #1e3a8a;
    }
    .summary-box div { text-align: center; }
    .summary-box strong {
      display: block;
      font-size: 22px;
      margin-top: 2px;
      color: rgb(3, 64, 171);
    }
    .action-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      min-width: 260px;
    }
    .save-btn {
      width: 100%;
      height: 100%;
      min-height: 60px;
      padding: 14px 28px;
      background: rgb(3, 64, 171);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .save-btn:hover { background: #022d7a; }
    #status {
      margin-top: 6px;
      text-align: right;
      font-size: 13px;
      font-weight: 600;
    }

    @media (max-width: 820px) {
      .product-row {
        grid-template-columns: 1fr 1fr;
      }
      .product-row > div:first-child {
        grid-column: 1 / -1;
      }
      .bottom-bar { flex-direction: column; }
      .summary-box { justify-content: space-around; }
      .action-right { width: 100%; }
    }
  </style>
</head>
<body>

<div class="website-container">
  <div class="banner-wrapper">
    <img src="Flexora%20HUB%20Banner.png" alt="Flexora HUB Banner" class="banner-img" />
  </div>

  <div class="top-nav">
    <a href="index.html" class="home-btn">← Home</a>
    <div class="page-tag">Ordinary Billing & Products Invoice</div>
  </div>

  <div class="content-area" id="formSection">
    <h2>Products & Invoice Entry</h2>

    <div class="customer-row">
      <label>Name of the Customer</label>
      <input type="text" id="customerName" placeholder="Enter Customer Name" />
    </div>

    <div class="products-header">
      <h3>Products List</h3>
      <button type="button" class="btn-add-product" onclick="addProductRow()">+ Add Product</button>
    </div>

    <div class="product-list" id="productList"></div>

    <div class="bottom-bar">
      <div class="summary-box">
        <div>Total Items<strong id="dispItemCount">1</strong></div>
        <div>Final Grand Total<strong id="dispGrandTotal">₹0</strong></div>
      </div>

      <div class="action-right">
        <button type="button" class="save-btn" id="generateBtn" onclick="prepareInvoice()">Generate Invoice</button>
        <div id="status"></div>
      </div>
    </div>
  </div>
</div>

<script>
  let rowCounter = 0;

  function addProductRow() {
    rowCounter++;
    const list = document.getElementById("productList");
    const row = document.createElement("div");
    row.className = "product-row";
    row.id = "prodRow_" + rowCounter;

    row.innerHTML = `
      <div>
        <label>Name of the Product</label>
        <input type="text" class="prod-name" placeholder="Enter Product Name" />
      </div>
      <div>
        <label>Product Quantity</label>
        <input type="number" class="prod-qty" min="1" value="1" oninput="calculateGrandTotal()" />
      </div>
      <div>
        <label>Product Price (₹)</label>
        <input type="number" class="prod-price" min="0" step="0.01" placeholder="0" oninput="calculateGrandTotal()" />
      </div>
      <div>
        <label>Total Value</label>
        <div class="row-total-box">₹0</div>
      </div>
      <div>
        <button type="button" class="btn-remove-row" title="Remove Product" onclick="removeProductRow('prodRow_${rowCounter}')">×</button>
      </div>
    `;

    list.appendChild(row);
    calculateGrandTotal();
  }

  function removeProductRow(rowId) {
    const list = document.getElementById("productList");
    if (list.children.length <= 1) {
      alert("At least 1 product row irukkanum machan!");
      return;
    }
    const row = document.getElementById(rowId);
    if (row) row.remove();
    calculateGrandTotal();
  }

  function calculateGrandTotal() {
    const rows = document.querySelectorAll(".product-row");
    let grandTotal = 0;

    rows.forEach(row => {
      const qty = parseFloat(row.querySelector(".prod-qty").value) || 0;
      const price = parseFloat(row.querySelector(".prod-price").value) || 0;
      const rowTotal = +(qty * price).toFixed(2);
      row.querySelector(".row-total-box").innerText = "₹" + rowTotal;
      grandTotal = +(grandTotal + rowTotal).toFixed(2);
    });

    document.getElementById("dispItemCount").innerText = rows.length;
    document.getElementById("dispGrandTotal").innerText = "₹" + grandTotal;
    return grandTotal;
  }

  function prepareInvoice() {
    const customerName = document.getElementById("customerName").value.trim();
    const statusEl = document.getElementById("status");

    if (!customerName) {
      statusEl.style.color = "red";
      statusEl.innerText = "Customer Name enter pannunga!";
      return;
    }

    const rows = document.querySelectorAll(".product-row");
    const items = [];
    for (let i = 0; i < rows.length; i++) {
      const name = rows[i].querySelector(".prod-name").value.trim();
      const qty = parseFloat(rows[i].querySelector(".prod-qty").value) || 0;
      const price = parseFloat(rows[i].querySelector(".prod-price").value) || 0;
      if (!name || qty <= 0 || price <= 0) {
        statusEl.style.color = "red";
        statusEl.innerText = `Product #${i + 1} details sariya enter pannunga!`;
        return;
      }
      items.push({ name, qty, price, total: +(qty * price).toFixed(2) });
    }

    statusEl.style.color = "green";
    statusEl.innerText = "Products & Grand Total ready! Aduthu Invoice format sollunga machan.";
  }

  // Initial 1 product row
  addProductRow();
</script>

</body>
</html>
